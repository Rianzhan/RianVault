# Dev compose: PostgreSQL + Qdrant bound to localhost only.
# The API runs on the host (uvicorn --reload) during development.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rianvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rianvault
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rianvault"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrantdata-dev:/qdrant/storage

volumes:
  pgdata-dev:
  qdrantdata-dev:
