# 遗失记忆审计候选信号（candidate signals）
#
# 命中 ≠ 真实长期记忆写入。这些信号只用于筛出「疑似记忆写入动作」的候选消息，
# 必须展示前后上下文给 Owner 人工审阅，由 Owner 标记
# successful_write / failed_write / retry_success / edit / delete / uncertain / ignore。
# 系统不得自动认定为真实记忆。
#
# 清单由Owner确认（2026-10-09）：原始 13 条 + 补充 18 条。随时可在此文件增补。
version: 1

signals:
  # --- 原始清单 ---
  - "Model set context updated."
  - "Model set context updated"
  - "加入记忆库"
  - "加入记忆"
  - "记住"
  - "保存"
  - "存好了"
  - "真的存进去了"
  - "记忆库满了"
  - "记忆空间已经满了"
  - "没有成功存进去"
  - "没存进去"
  - "保存失败"
  # --- 2026-10-09 补充 ---
  - "更新记忆"
  - "更新进记忆"
  - "写入记忆"
  - "写进记忆"
  - "已经记住"
  - "我记住了"
  - "已保存到记忆"
  - "保存到记忆"
  - "记忆已更新"
  - "记忆更新成功"
  - "记忆写入失败"
  - "更新失败"
  - "存储失败"
  - "没有更新进去"
  - "没有写进去"
  - "没更新成功"
  - "记忆满了"
  - "memory full"

# 候选消息前后默认展示的上下文窗口（条数）
default_context_window: 6
