[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rianvault-backend"
version = "0.1.0"
description = "RianVault backend - private memory vault API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
pg = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "TRY", "BLE", "S"]
ignore = [
  "B008",    # FastAPI 依赖注入惯用法（Depends/Query/File 在默认参数中）
  "RUF001", "RUF002", "RUF003",  # 中文全角标点被误判为歧义字符（本项目为中文项目）
  "TRY003",  # raise 带详细中文信息是给 Owner 看的，不算违规
  "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest 断言
"alembic/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
