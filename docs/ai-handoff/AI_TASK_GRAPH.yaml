owner_alias: "Owner"
canonical_source: "docs/RIANVAULT_HANDOVER.md"

conventions:
  status_values: [done, in_progress, not_started, blocked]
  gate_values: [none, owner_decision]
  principle: "先用评测拿到数字，再决定要不要加复杂度。"

tasks:

