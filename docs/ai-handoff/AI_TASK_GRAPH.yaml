    ref: "docs/RIANVAULT_HANDOVER.md §6.5、§19"

  - id: PH15-2
    title: "检索评测（二）：开放式 P@K / Recall@K（pooled relevance judgment）"
    phase: "Phase 1.5"
    status: not_started
    depends_on: [PH15-1]
    gate: owner_decision
    note: "需要人工标注，成本远高于 PH15-1；是否投入由 Owner 决定"
    outputs:
      - "人工判定的相关池 + Precision@K / Recall@K / nDCG"
    ref: "docs/RIANVAULT_HANDOVER.md §6.5"

  - id: PH15-3
    title: "依评测数字决定是否上 BM25 关键词排序"
    phase: "Phase 1.5"
